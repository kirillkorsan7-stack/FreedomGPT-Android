services:
  - type: web
    name: freedomgpt-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: FREEDOMGPT_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-6-luna
